# ============================================================================
# HALO-A311D —— Amlogic A311D, MAIN_V0.3 底板 + 核心板
#
# 落点: userpatches/config/boards/halo-a311d.conf
#   依据 lib/functions/main/config-prepare.sh 的 config_source_board_file():
#     board_file_paths=("${SRC}/config/boards" "${USERPATCHES_PATH}/config/boards")
#   → 上游与本目录都会被 source，放这里 = 不碰上游文件。
#
# 同 SoC 参考: Khadas VIM3，BOOTCONFIG 复用其 defconfig。
# ============================================================================

BOARD_NAME="HALO-A311D"
BOARDFAMILY="meson-g12b"
BOOTCONFIG="khadas-vim3_defconfig"      # 同 SoC (A311D) 复用
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
SERIALCON="ttyAML0"                     # 调试口 = UART_AO
BOOT_LOGO="desktop"
BOOT_FDT_FILE="amlogic/meson-halo-a311d.dtb"

# ============================================================================
# FIP 树路径 —— 必须放在 cache/ 之外
#
# 原因: config/sources/families/include/meson64_common.inc 的
#   fetch_sources_tools__libreelec_amlogic_fip() 会 fetch_from_repo 到
#   $SRC/cache/sources/amlogic-boot-fip，而 fetch_from_repo 会 git clean
#   掉该目录下所有未跟踪内容。LibreELEC 仓库里没有 halo-a311d 目录
#   → 拷进 cache 的自定义 FIP 树每次构建都被删。
#
# 症状: uboot_g12_postprocess 报 ".../halo-a311d/blx_fix.sh: No such file" (127)
#
# 用 ${VAR:-default} 让外部可用环境变量覆盖（CI 与本地走同一条路）:
#   export FIP_TREE_HALO_A311D=/path/to/amlogic-boot-fip/halo-a311d
# 默认值指向 ${SRC}/fip/halo-a311d，由 scripts/deploy-to-build.sh 从本仓库
# 的 fip/ 目录拷进去。
# ============================================================================
FIP_TREE_HALO_A311D="${FIP_TREE_HALO_A311D:-${SRC}/fip/halo-a311d}"

# ============================================================================
# 说明
#
# 1. u-boot 的 FIP 组装入口 uboot_custom_postprocess() 由
#      userpatches/config/sources/families/meson-g12b.conf 覆盖
#    （该文件在 core 之后 source，函数重定义生效）。
#
# 2. 内核 dts 不在这里，见 dt/meson-halo-a311d.dts 与
#    dt/meson-halo-a311d-pcie.dts，由 scripts/deploy-to-build.sh 派生到
#      userpatches/kernel/archive/meson64-<MAJOR.MINOR>/dt/
#    （目录名随内核大版本变，脚本从 meson64_common.inc 的 case $BRANCH
#     派生，不写死版本号 —— 写死就是「镜像编出来了但里面没有本板 dtb」那个坑）。
#
# 3. PCIe/USB3.0 冷切换: 本板FUSB340TMX 的 SEL(GPIOA_2) 由 R85/R87
#    二选一跳线决定。R85(下拉)=USB3.0 / R87(上拉)=PCIe。
#    两个 dtb 都会编进内核，由 U-Boot 读 SEL 自动选择:
#      /boot/althaea-mode.hush
#
# 4. ASOUND_STATE 未设置 → 回退 family 默认 asound.state.meson64
#    （本板音频未适配，见 dts 中「音频不保留」段）。
# ============================================================================
