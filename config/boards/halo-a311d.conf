# ============================================================================
# HALO-A311D —— Amlogic A311D, MAIN_V0.3 底板 + 核心板
#
# 落点: userpatches/config/boards/halo-a311d.conf
#   依据 lib/functions/main/config-prepare.sh 的 config_source_board_file():
#     board_file_paths=("${SRC}/config/boards" "${USERPATCHES_PATH}/config/boards")
#   → 上游与本目录都会被 source，放这里 = 不碰上游文件。
#
# 同 SoC 参考: Khadas VIM3，BOOTCONFIG 复用其 defconfig。
# ============================================================================

BOARD_NAME="HALO-A311D"
BOARDFAMILY="meson-g12b"
BOOTCONFIG="khadas-vim3_defconfig"      # 同 SoC (A311D) 复用
BOOTBRANCH_BOARD="tag:v2026.04"          # 同 VIM3：挑有 board patch 的 u-boot 版本
BOOTPATCHDIR="v2026.04"                  # 同 VIM3：含 board_khadas-vim3 的 boot-first patch
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
SERIALCON="ttyAML0"                     # 调试口 = UART_AO
BOOT_LOGO="desktop"
BOOT_FDT_FILE="amlogic/meson-halo-a311d.dtb"

# ============================================================================
# 说明
#
# 1. u-boot 的 FIP 组装入口 uboot_custom_postprocess() 由
#      userpatches/config/sources/families/meson-g12b.conf 覆盖
#    （该文件在 core 之后 source，函数重定义生效）。
#
# 2. 内核 dts 不在这里，见 dt/meson-halo-a311d.dts 与
#    dt/meson-halo-a311d-pcie.dts，由 scripts/deploy-to-build.sh 派生到
#      userpatches/kernel/archive/meson64-<MAJOR.MINOR>/dt/
#    （目录名随内核大版本变，脚本从 meson64_common.inc 的 case $BRANCH
#     派生，不写死版本号 —— 写死就是「镜像编出来了但里面没有本板 dtb」那个坑）。
#
# 3. PCIe/USB3.0 冷切换: 本板FUSB340TMX 的 SEL(GPIOA_2) 由 R85/R87
#    二选一跳线决定。R85(下拉)=USB3.0 / R87(上拉)=PCIe。
#    两个 dtb 都会编进内核，由 U-Boot 读 SEL 自动选择:
#      /boot/althaea-mode.hush
#
# 4. ASOUND_STATE 未设置 → 回退 family 默认 asound.state.meson64
#    （本板音频未适配，见 dts 中「音频不保留」段）。
# ============================================================================

# ============================================================================
# u-boot FIP 组装 —— gxlimg 全主线方案（分支 gxlimg-full-mainline-uboot）
#
# ## 与 main 分支（LibreELEC 方案）的区别
#
# main 分支：uboot 用 LibreELEC 的 khadas-vim3 FIP（含厂商原版 u-boot 作 bl33）
# 本分支：  uboot **完全用主线**，用 gxlimg 把厂商 FIP 里的 bl33 换成主线的
#
# ## 原理（依据 extensions/gxlimg.sh:81 的 g12a|g12b 分支）
#
#   1. gxlimg -e<FIP blob>            解包厂商 FIP
#        → bl2.sign / bl30.enc / bl31.enc / ddr*.fw（**原厂签名态，不动**）
#   2. rm bl33.enc                删掉原厂 u-boot
#   3. gxlimg -t bl3x -s raw-u-boot.bin
#        用主线 u-boot.bin 重新签名生成 bl33.enc
#   4. gxlimg -t fip --bl2 ... --ddrfw ... --bl30 ... --bl31 ... --bl33 ...
#        --rev v3 u-boot.bin         重打包成完整 FIP
#
# 优点：u-boot 是主线的（可用主线 U-Boot 的所有功能与修复）
# 前提：**必须有一个完整的厂商 FIP blob**（DDR.USB / mmcblk*boot0 / FIP.img 均可），
#       不能是解包后的散件 —— 散件缺bl2.sign 的原厂签名，无法通过校验。
#
# ## ⚠ 待办：放入本板FIP blob
#
#   需要文件：fip-blob/halo-a311d/<厂商 FIP 文件>
#   获取方式（二选一，参见 retro98boy/amlogic-devices 的cainiao-cniot-core README）：
#     a) 从厂商 USB 刷写包解包
#        aml_image_v2_packer -d <线刷包.img> <输出目录>   → 得到 DDR.USB
#     b) 从设备 eMMC boot area 直接 dd（需root）
#        dd if=/dev/mmcblk1boot0 of=fip.bin bs=512 skip=1
#        # 或 user area：A311D 在 user area 找不到 FIP 时会回退 boot area，
#        #   所以两个位置的内容通常相同
#        dd if=/dev/mmcblk1    of=fip.bin bs=512 skip=1 count=8192
#
#   本地 blob 放好后deploy-to-build.sh 会自动拷进 build 树；
#   CI 上则需推到本仓库（建议用 git-lfs，单个 blob 1.5~4MB）。
#
#   ⚠ 不要用amlogic-boot-fip 那种「解包后的散件目录」——
#     gxlimg -e 需要的是**未解包的 FIP 文件**。
# ============================================================================

# gxlimg（重打包）+ amlogic-fip-blobs（厂商 blob 仓库）
# 机制完全同 cainiao-cniot-core（同样A311D）
enable_extension "gxlimg"
enable_extension "amlogic-fip-blobs"

function post_family_config__use_repacked_fip() {
	# gxlimg 直接产出完整 u-boot.bin，不需要 target map 拆分
	declare -g UBOOT_TARGET_MAP="u-boot.bin"
	unset write_uboot_platform

	function write_uboot_platform() {
		dd if="$1/u-boot.bin" of="$2" bs=512 seek=1 conv=fsync,notrunc 2>&1
	}
}

# ⚠⚠ blob 必须在**这个 hook 里**放置，不能靠 CI 预先拷。
#
# 原因（实测踩过）：armbian 的 fetch_sources_tools__amlogic-fip-blobs() 会在
#   $SRC/cache/sources/amlogic-fip-blobs 做 `git init` + checkout + reset，
#   把该目录下**所有未跟踪文件清掉**。
#   CI 里「Inject board files」步骤发生在 Build kernel 之前 → blob 被冲掉 →
#   报 "本板 FIP blob 未找到"。
#   而 post_uboot_custom_postprocess__* hook 在 fetch_sources 之后执行，此时放才留得住。
#
# 存放位置：**不能**放 amlogic-fip-blobs/（会被 git 管），
#   改放 ${SRC}/cache/fip-blobs/ —— 那是普通目录，armbian 不碰。
function post_uboot_custom_postprocess__repack_vendor_fip_with_mainline_uboot() {
	declare blob_dir="${SRC}/cache/fip-blobs/halo-a311d"
	declare blob

	# 本仓库的 blob 位置（deploy 脚本拷到 userpatches，这里再取出来）
	declare src_blob="${USERPATCHES_PATH}/fip-blob/halo-a311d"

	if [ ! -d "${blob_dir}" ]; then
		mkdir -p "${blob_dir}"
		if [ -d "${src_blob}" ]; then
			cp -a "${src_blob}/." "${blob_dir}/" 2>/dev/null || true
		fi
	fi

	blob="$(find "${blob_dir}" -maxdepth 1 -type f ! -name 'README*' ! -name '*.txt' \
		\( -name '*.USB' -o -name '*.usb' -o -name '*.img' -o -name '*.bin' \
		   -o -name 'mmcblk*boot*' \) 2>/dev/null | head -1)"
	if [[ -z "${blob}" ]]; then
		exit_with_error "本板 FIP blob 未找到" \
			"查找位置: ${blob_dir}（应含 DDR.USB / mmcblk1boot0 / FIP.img 等完整 FIP 文件）" \
			"来源位置: ${src_blob}" \
			"⚠ 必须是**完整的厂商 FIP 文件**，不是 amlogic-boot-fip 那种解包后的散件。详见 config/boards/halo-a311d.conf 的说明。"
	fi
	display_alert "${BOARD}: FIP blob" "${blob}" "info"
	gxlimg_repack_fip_with_new_uboot "${blob}" g12b
}

# u-boot 额外配置（与 main 分支同）
function post_config_uboot_target__extra_configs_for_halo_a311d() {
	display_alert "u-boot for ${BOARD}" "enable compression support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LZO
	run_host_command_logged scripts/config --enable CONFIG_BZIP2
	run_host_command_logged scripts/config --enable CONFIG_ZSTD
	display_alert "u-boot for ${BOARD}" "enable kaslrseed support" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_KASLRSEED
	display_alert "u-boot for ${BOARD}" "enable gpio LED support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LED
}
