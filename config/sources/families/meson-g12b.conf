# ============================================================================
# meson-g12b family 覆盖 —— **唯一目的：让 halo-a311d 走VIM3 那条空操作分支**
#
# 上游 config/sources/families/meson-g12b.conf:11-30的 if/elif 链末尾是：
#     else
#         echo "Don't know how to handle FIP trees for board '${BOARD}'"
#         exit 2
#     fi
# 新板名不在这条链里 → 直接 exit 2，构建中断。
#
# 上游对 Khadas VIM3 的处理（config/boards/khadas-vim3.conf）：
#   - family 主函数里 VIM3 走的是 `:` 空操作分支
#   - 真正的 FIP 组装放在 **hook**：
#         function post_uboot_custom_postprocess__khadas_vim3_uboot() {
#             uboot_g12_postprocess "${SRC}"/cache/sources/amlogic-boot-fip/khadas-vim3 g12b
#         }
#     hook 在主函数之后执行（hook 名post_<func>__<suffix>）。
#
# 所以本板完全照抄这个模式：
#   - 本文件：把 halo-a311d 加进 VIM3 的空操作分支
#   - board conf：hook 里做实际的 FIP 组装
#
#   main 分支             → hook 用 uboot_g12_postprocess + LibreELEC khadas-vim3
#   gxlimg-full-mainline-uboot 分支 → hook 用 gxlimg_repack_fip_with_new_uboot + 厂商 blob
#   两者都**不重定义** uboot_custom_postprocess，只加分支。
#
# 生效原理（同config/sources/families/include/meson64_common.inc 的 source 顺序）:
#   main-config.sh:source_family_config_and_arch() 先 source core的
#   config/sources/families/meson-g12b.conf，再 source ${USERPATCHES_PATH}/config/
#   sources/families/meson-g12b.conf —— 同一个 shell，**后定义的函数生效**，
#   所以无需改动上游任何字节。
#
# ⚠ 同步点：若上游改了 if/elif 链，需把本文件的 uboot_custom_postprocess()
#   与 config/sources/families/meson-g12b.conf 保持一致。
# ============================================================================

function uboot_custom_postprocess() {
	if [[ $BOARD == odroidn2l ]]; then
		uboot_g12_postprocess "$SRC"/cache/sources/amlogic-boot-fip/odroid-n2l g12b
	elif [[ $BOARD == odroidn2* ]]; then
		:
	elif [[ $BOARD == khadas-vim3 ]] || [[ $BOARD == cainiao-cniot-core ]] || [[ $BOARD == halo-a311d ]]; then
		# VIM3 / CNIoT / 本板：主函数不做 FIP 组装，
		# 交给 board conf 里的 post_uboot_custom_postprocess__halo_a311d_uboot hook
		# （与上游 khadas-vim3 同款机制）
		:
	elif [[ $BOARD == radxa-zero2 ]]; then
		uboot_g12_postprocess "$SRC"/cache/sources/amlogic-boot-fip/radxa-zero2 g12b
	elif [[ $BOARD == bananapim2s ]]; then
		uboot_g12_postprocess "$SRC"/cache/sources/amlogic-boot-fip/bananapi-m2s g12b
	elif [[ $BOARD == bananapicm4io ]]; then
		uboot_g12_postprocess "$SRC"/cache/sources/amlogic-boot-fip/bananapi-m2s g12b
	else
		echo "Don't know how to handle FIP trees for board '${BOARD}'"
		exit 2
	fi
}
