# =============================================================================
# halo-a311d —— DTB 语法检查
#
# 方案演进（踩坑记录）:
#   v1 git clone torvalds/linux --sparse → 15 秒 exit 127，整仓太重
#   v2 tarball v6.18.tar.gz           → 仍是 250MB 全量下载，且 raw API 在部分网络不通
#   v3 稀疏 clone + scripts/dtc      → sparse 清单漏了 include/dt-bindings
#   v4 稀疏 clone + include/dt-bindings（当前）→ 修正，ls 预检
#
# 关键: include-prefixes 必须在 sparse 清单里，否则 dt-bindings 头找不到，
#      会报 "GPIOAO_10 未定义" 这类假错误。
# =============================================================================
name: dtb-check

on:
  push:
    branches: [main]
    paths:
      - 'dt/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'dt/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  KVER: '6.18'

jobs:
  dtb:
    name: DTB syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain (dtc usually preinstalled)
        # ubuntu runner 镜像已预装 device-tree-compiler。
        # 不要无条件 `apt-get install`：遇到"已是最新版"会返回非 0，
        # 在 set -e 下直接把 job 打断（这正是第二次失败 exit code 2 的疑点）。
        run: |
          set -eu
          if ! command -v dtc >/dev/null 2>&1; then
            echo "dtc 未预装，开始安装..."
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq device-tree-compiler || true
          fi
          # 最终校验：缺命令就在这里明确报错，而不是让下一步莫名 exit 127
          command -v dtc  || { echo "::error::dtc 缺失"; exit 1; }
          command -v cpp || { echo "::error::cpp (gcc) 缺失"; exit 1; }
          dtc --version
          echo "cpp: $(cpp --version | head -1)"

      - name: Sparse-clone kernel dts
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          # blob:none 只取 commit/tree，对文件按需拉取，比整仓 clone 快得多
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/torvalds/linux.git" kernel
          cd kernel
          # ⚠ dt-bindings 常量在 include/dt-bindings/，不在 scripts/dtc/
          #   meson-g12a-gpio.h 提供 GPIOAO_10 等宏，缺了会报未定义
          # cone 模式：目录整棵拉下来。
          # ⚠ 不要用 --no-cone + '**' 通配 —— 实测会漏掉
          #   include/dt-bindings/input/linux-event-codes.h
          #   （通配在 --no-cone 下只匹配一层，深层目录拿不到）
          git sparse-checkout set \
            arch/arm64/boot/dts/amlogic \
            include/dt-bindings
          echo "--- dt-bindings 目录清单 ---"
          ls "$RUNNER_TEMP/kernel/include/dt-bindings/input/" || \
            echo "::error::input/ 目录未拉下来"
          ls "$RUNNER_TEMP/kernel/include/dt-bindings/interrupt-controller/" || \
            echo "::error::interrupt-controller/ 未拉下来"
          echo "--- 关键文件校验 ---"
          ls arch/arm64/boot/dts/amlogic/meson-g12-common.dtsi
          ls arch/arm64/boot/dts/amlogic/meson-g12b.dtsi
          ls include/dt-bindings/gpio/meson-g12a-gpio.h
          ls include/dt-bindings/gpio/gpio.h
          ls include/dt-bindings/leds/common.h

      - name: Compile DTBs
        run: |
          set -eux
          K="$RUNNER_TEMP/kernel"
          D="$K/arch/arm64/boot/dts/amlogic"
          # 板级 dts 放进 amlogic 目录（同名会被覆盖，无冲突则新增）
          cp "$GITHUB_WORKSPACE/dt/meson-halo-a311d.dts"      "$D/"
          cp "$GITHUB_WORKSPACE/dt/meson-halo-a311d-pcie.dts" "$D/"

          fail=0
          # 先确认 dts 依赖链完整（只有 SoC 级文件，板级 dts 已由上面 cp 放入）
          for req in meson-g12b-a311d.dtsi meson-g12.dtsi \
                     meson-g12-common.dtsi meson-g12b-s922x.dtsi; do
            if [ ! -f "$D/$req" ]; then
              echo "::error::缺少 SoC 依赖 $D/$req"
              ls "$D" | head -30
              exit 1
            fi
          done
          # 板级 dts 必须确认已放入（cp 失败要立刻知道）
          for f in meson-halo-a311d.dts meson-halo-a311d-pcie.dts; do
            if [ ! -f "$D/$f" ]; then
              echo "::error::板级 dts 未就位 $D/$f"
              exit 1
            fi
          done
          echo "--- 诊断 ---"
          echo "K=$K"
          echo "输入头列表:"
          grep -oE '#include <dt-bindings/[^>]+>' "$D/meson-halo-a311d.dts" || true
          echo "input 目录实际内容:"
          ls -la "$K/include/dt-bindings/input/" 2>&1 || true
          echo "--- 逐个校验 ---"
          # 逐一校验 dts 里 include 的每个 dt-bindings 头
          grep -oE '#include <dt-bindings/[^>]+>' "$D/meson-halo-a311d.dts" \
            | sed 's/.*<\(.*\)>.*/\1/' | sort -u > /tmp/hdrs.txt
          while read -r hdr; do
            [ -z "$hdr" ] && continue
            if [ -f "$K/include/$hdr" ]; then
              echo "  ok  $hdr"
            else
              echo "::error::缺少头文件 include/$hdr"
              echo "已下载的 dt-bindings 顶层:"
              ls "$K/include/dt-bindings/" 2>&1 || true
              echo "input/ 下有:"
              ls "$K/include/dt-bindings/input/" 2>&1 || true
              exit 1
            fi
          done < /tmp/hdrs.txt

          for f in meson-halo-a311d meson-halo-a311d-pcie; do
            echo "::group::compile $f.dtb"
            cpp -nostdinc \
                -I "$D" \
                -I "$K/include" \
                -undef -D__DTS__ -x assembler-with-cpp \
                "$D/$f.dts" -o "/tmp/$f.pp.dts"
            dtc -I dts -O dtb -o "/tmp/$f.dtb" "/tmp/$f.pp.dts" 2>"/tmp/$f.err" || true
            # 过滤上游既有警告（unit_address_vs_reg 等），只看本板问题
            grep -vE 'unit_address_vs_reg|simple_bus_reg|avoid_unnecessary_addr_size|also defined at' \
                 "/tmp/$f.err" > "/tmp/$f.filt" || true
            if [ -s "/tmp/$f.filt" ]; then
              echo "::error file=dt/$f.dts::$(head -1 "/tmp/$f.filt")"
              cat "/tmp/$f.filt"
              fail=1
            else
              echo "OK  $f.dtb  ($(stat -c%s "/tmp/$f.dtb") bytes)"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: halo-a311d-dtb
          path: /tmp/meson-halo-a311d*.dtb
