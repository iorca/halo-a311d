# =============================================================================
# halo-a311d —— DTB 语法检查
#
# 方案演进（踩坑记录）:
#   v1 git clone torvalds/linux --sparse → 15 秒 exit 127，整仓太重
#   v2 tarball v6.18.tar.gz           → 仍是 250MB 全量下载，且 raw API 在部分网络不通
#   v3 稀疏 clone + scripts/dtc      → sparse 清单漏了 include/dt-bindings
#   v4 稀疏 clone + include/dt-bindings（当前）→ 修正，ls 预检
#
# 关键: include-prefixes 必须在 sparse 清单里，否则 dt-bindings 头找不到，
#      会报 "GPIOAO_10 未定义" 这类假错误。
# =============================================================================
name: dtb-check

on:
  push:
    branches: [main]
    paths:
      - 'dt/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'dt/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  KVER: '6.18'

jobs:
  dtb:
    name: DTB syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Verify toolchain (dtc usually preinstalled)
        # ubuntu runner 镜像已预装 device-tree-compiler。
        # 不要无条件 `apt-get install`：遇到"已是最新版"会返回非 0，
        # 在 set -e 下直接把 job 打断（这正是第二次失败 exit code 2 的疑点）。
        run: |
          set -eu
          if ! command -v dtc >/dev/null 2>&1; then
            echo "dtc 未预装，开始安装..."
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq device-tree-compiler || true
          fi
          # 最终校验：缺命令就在这里明确报错，而不是让下一步莫名 exit 127
          command -v dtc  || { echo "::error::dtc 缺失"; exit 1; }
          command -v cpp || { echo "::error::cpp (gcc) 缺失"; exit 1; }
          dtc --version
          echo "cpp: $(cpp --version | head -1)"

      - name: Sparse-clone kernel dts
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          # blob:none 只取 commit/tree，对文件按需拉取，比整仓 clone 快得多
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/torvalds/linux.git" kernel
          cd kernel
          # ⚠ dt-bindings 常量在 include/dt-bindings/，不在 scripts/dtc/
          #   meson-g12a-gpio.h 提供 GPIOAO_10 等宏，缺了会报未定义
          # ⚠⚠ 必须包含 include/uapi —— dt-bindings 里有些头是符号链接指向它：
          #     include/dt-bindings/input/linux-event-codes.h
          #       -> ../../uapi/linux/input-event-codes.h
          #   sparse 不拉 include/uapi 时链接断裂，[ -f ] 返回 false，
          #   会误报"头文件缺失"。这是本次 CI 排障最费时的一个坑。
          git sparse-checkout set \
            arch/arm64/boot/dts/amlogic \
            include/dt-bindings \
            include/uapi
          echo "--- 校验符号链接是否有效 ---"
          ls -la "$RUNNER_TEMP/kernel/include/dt-bindings/input/linux-event-codes.h"
          test -f "$RUNNER_TEMP/kernel/include/dt-bindings/input/linux-event-codes.h" || {
            echo "::error::linux-event-codes.h 仍是断链（include/uapi 未拉下来）"
            exit 1
          }
          echo "符号链接 OK"
          echo "--- 关键文件校验 ---"
          ls arch/arm64/boot/dts/amlogic/meson-g12-common.dtsi
          ls arch/arm64/boot/dts/amlogic/meson-g12b.dtsi
          ls include/dt-bindings/gpio/meson-g12a-gpio.h
          ls include/dt-bindings/gpio/gpio.h
          ls include/dt-bindings/leds/common.h

      - name: Verify board DTS includes exactly one SoC dtsi
        # 直接卡住「同时 include 多份 SoC 的 dtsi」这个**病因**。
        #
        #   meson-g12b-a311d.dtsi / meson-g12b-s922x.dtsi 等都在根节点下定义
        #   同名 opp-table-0 / opp-table-1（label 也同名），电压值不同。
        #   dtc 合并它们而不是报错（livetree.c: merge_nodes()），
        #   产出一张跨 SoC 混搭的 CPU 频率-电压表。
        #
        #   本板是 A311D → 只允许 meson-g12b-a311d.dtsi 一份。
        run: |
          set -eu
          fail=0
          for f in "$GITHUB_WORKSPACE"/dt/meson-halo-a311d.dts \
                   "$GITHUB_WORKSPACE"/dt/meson-halo-a311d-pcie.dts; do
            echo "::group::include check $(basename "$f")"
            # 板级 dts 只应 include 恰好一个 SoC 级 dtsi
            n=$(grep -cE '^#include "meson-g12b-[a-z0-9]*\.dtsi"' "$f" || true)
            names=$(grep -oE '^#include "meson-g12b-[a-z0-9]*\.dtsi"' "$f" \
                    | sed 's/.*"\(.*\)"/\1/' | tr '\n' ' ')
            echo "  SoC dtsi 引用: $names"
            if [ "$n" -ne 1 ]; then
              echo "::error file=dt/$(basename "$f")::应恰好 include 1 个 SoC dtsi，实际 $n 个（$names）"
              echo "::error::多个 SoC dtsi 会定义同名 opp-table-0/opp-table-1，"
              echo "::error::dtc 会把它们合并成混搭的 CPU 频率-电压表。"
              fail=1
            elif ! grep -q '^#include "meson-g12b-a311d.dtsi"' "$f"; then
              echo "::error file=dt/$(basename "$f")::本板是 A311D，应 include meson-g12b-a311d.dtsi"
              fail=1
            else
              echo "  OK: 只 include meson-g12b-a311d.dtsi"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Compile DTBs
        run: |
          set -eux
          K="$RUNNER_TEMP/kernel"
          D="$K/arch/arm64/boot/dts/amlogic"
          # 板级 dts 放进 amlogic 目录（同名会被覆盖，无冲突则新增）
          cp "$GITHUB_WORKSPACE/dt/meson-halo-a311d.dts"      "$D/"
          cp "$GITHUB_WORKSPACE/dt/meson-halo-a311d-pcie.dts" "$D/"

          fail=0
          # 先确认 dts 依赖链完整（只有 SoC 级文件，板级 dts 已由上面 cp 放入）
          # ⚠ 列表必须与板级 dts 的实际 include 链一致：
          #   meson-h12b-a311d.dtsi → meson-g12b.dtsi → meson-g12.dtsi
          #                                    → meson-g12-common.dtsi
          #   以前这里列的是 meson-g12b-s922x.dtsi（那是多余 include 带来的依赖），
          #   却漏了真正必需的 meson-g12b.dtsi —— 依赖链检查形同虚设。
          for req in meson-g12b-a311d.dtsi meson-g12b.dtsi meson-g12.dtsi \
                     meson-g12-common.dtsi; do
            if [ ! -f "$D/$req" ]; then
              echo "::error::缺少 SoC 依赖 $D/$req"
              ls "$D" | head -30
              exit 1
            fi
          done
          # 板级 dts 必须确认已放入（cp 失败要立刻知道）
          for f in meson-halo-a311d.dts meson-halo-a311d-pcie.dts; do
            if [ ! -f "$D/$f" ]; then
              echo "::error::板级 dts 未就位 $D/$f"
              exit 1
            fi
          done
          echo "--- 校验 dts 引用的每个 dt-bindings 头 ---"
          # 逐一校验 dts 里 include 的每个 dt-bindings 头
          grep -oE '#include <dt-bindings/[^>]+>' "$D/meson-halo-a311d.dts" \
            | sed 's/.*<\(.*\)>.*/\1/' | sort -u > /tmp/hdrs.txt
          while read -r hdr; do
            [ -z "$hdr" ] && continue
            # shell test -f 对**有效**符号链接返回 true，断链返回 false
            if [ -f "$K/include/$hdr" ]; then
              echo "  ok  $hdr"
            else
              echo "::error::缺少头文件 include/$hdr"
              echo "已下载的 dt-bindings 顶层:"
              ls "$K/include/dt-bindings/" 2>&1 || true
              echo "input/ 下有:"
              ls "$K/include/dt-bindings/input/" 2>&1 || true
              exit 1
            fi
          done < /tmp/hdrs.txt

          for f in meson-halo-a311d meson-halo-a311d-pcie; do
            echo "::group::compile $f.dtb"
            cpp -nostdinc \
                -I "$D" \
                -I "$K/include" \
                -undef -D__DTS__ -x assembler-with-cpp \
                "$D/$f.dts" -o "/tmp/$f.pp.dts"
            # ⚠⚠ 不能 `dtc ... || true`：那会把**退出码直接丢掉**，
            #   只剩「过滤后 stderr 是否非空」这一个判据。
            #   一旦 dtc 失败却没留下未被过滤的 stderr（或 stderr 恰好全是
            #   上游既有警告），就会走进 else 打印 "OK" —— 又一个假绿灯。
            #   （与 kernel.yml 里 ::error:: 不配 exit 1 是同一类错误）
            #   → 显式接住退出码，并且**额外验证产物文件非空**。
            set +e
            dtc -I dts -O dtb -o "/tmp/$f.dtb" "/tmp/$f.pp.dts" 2>"/tmp/$f.err"
            dtc_rc=$?
            set -e
            # 过滤上游既有警告（unit_address_vs_reg 等），只看本板问题
            #
            # ⚠⚠⚠ 不要再过滤 "also defined at"！
            #   那是 dtc 报告「同名节点/属性被合并」时打的位置信息
            #   （checks.c: check_msg() → "  also defined at %s"）。
            #   本仓库曾因为过滤掉它而长期看不见一个真 bug：
            #   板级 DTS 同时 include 了 a311d 与 s922x 两份 SoC 的 dtsi，
            #   两者都定义同名 opp-table-0/opp-table-1，dtc 会**合并**成混搭表
            #   （livetree.c: merge_nodes()），CPU 频率-电压表被污染。
            #   dtc 自己不报错（合并后树里已无重名节点），
            #   所以「also defined at」是当时唯一能暴露问题的线索。
            grep -vE 'unit_address_vs_reg|simple_bus_reg|avoid_unnecessary_addr_size' \
                 "/tmp/$f.err" > "/tmp/$f.filt" || true
            if [ "$dtc_rc" -ne 0 ]; then
              # 不管 stderr 被过滤成什么样，dtc 自己都说失败了 → 必须红
              echo "::error file=dt/$f.dts::dtc 失败，退出码 $dtc_rc"
              cat "/tmp/$f.err"
              fail=1
            elif [ ! -s "/tmp/$f.dtb" ]; then
              # 没产出 dtb / 产出 0 字节 —— 以前只在 else 分支里 stat 打印一下，
              # 从不检查，0 字节也会显示 OK
              echo "::error file=dt/$f.dts::dtc 未产出 dtb 或文件为空"
              cat "/tmp/$f.err"
              fail=1
            elif [ -s "/tmp/$f.filt" ]; then
              echo "::error file=dt/$f.dts::$(head -1 "/tmp/$f.filt")"
              cat "/tmp/$f.filt"
              fail=1
            else
              echo "OK  $f.dtb  ($(stat -c%s "/tmp/$f.dtb") bytes)"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Verify CPU OPP tables against upstream A311D
        # ⚠ 这道检查对应一个真实的、dtc 查不出来的 bug。
        #
        #   板级 DTS 曾经同时 include meson-g12b-a311d.dtsi 和
        #   meson-g12b-s922x.dtsi。两者都定义根节点下的同名
        #   opp-table-0 / opp-table-1，电压值不同（A311D 1GHz=761000µV，
        #   S922X 1GHz=731000µV）。
        #
        #   dtc 对同名节点是**合并**（livetree.c: merge_nodes()）而不是报错：
        #   属性后者覆盖前者，子节点取并集 → 产出一张跨 SoC 混搭的
        #   频率-电压表，还混进 A311D 不支持的 1.896 / 1.992 GHz。
        #   合并后树里已无重名节点，所以 dtc 的 duplicate_node_names /
        #   duplicate_label 两道 ERROR 级检查都不触发，
        #   **dtc 退出码是 0，CI 全绿，产物却是错的**。
        #
        #   所以只能显式比对：DTB 里的 OPP 表必须与上游
        #   meson-g12b-a311d.dtsi 的定义完全一致。
        run: |
          set -eu
          K="$RUNNER_TEMP/kernel"
          REF="$K/arch/arm64/boot/dts/amlogic/meson-g12b-a311d.dtsi"
          if [ ! -f "$REF" ]; then
            echo "::error::找不到上游参考 $REF"
            exit 1
          fi
          echo "参考文件: $REF"
          fail=0
          for f in meson-halo-a311d meson-halo-a311d-pcie; do
            echo "::group::OPP check $f.dtb"
            # 三个输入：编译出的 dtb、该变体的板级 dts、上游 a311d dtsi。
            # 脚本从板级 dts 读出每个 &cpuN 声明的 operating-points-v2，
            # 再到 dtb 里反查该 cpu 实际引用的表，逐项与上游比对。
            if ! python3 "$GITHUB_WORKSPACE/scripts/check-opp-tables.py" \
                 "/tmp/$f.dtb" \
                 "$GITHUB_WORKSPACE/dt/$f.dts" \
                 "$REF"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Upload DTBs
        uses: actions/upload-artifact@v5
        with:
          name: halo-a311d-dtb
          path: /tmp/meson-halo-a311d*.dtb
          # ⚠ 默认 warn 意味着「一个都没传上去」也显示绿灯；
          #   上面已经确认文件非空才走到这里，所以必须是硬条件。
          if-no-files-found: error
