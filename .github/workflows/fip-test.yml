# =============================================================================
# halo-a311d —— FIP 组装测试（x86 runner，~2 分钟）
#
# 用途：FIP 组装是完整构建里最容易挂的一环（要跑 x86 的 aml_encrypt），
#   但失败要等 50 分钟才看到。这里单独跑，几分钟出结果。
#
# 背景问题：
#   本仓库 fip/halo-a311d/ 的文件来自两个不同来源：
#     - ddr*.fw / bl301.bin / acs.bin / piei.fw 等 → 与 LibreELEC khadas-vim3 完全相同
#     - aml_encrypt_g12b / bl2.bin / bl30.bin / bl31.img → 与 LibreELEC 不同（厂商SDK 版）
#   混用结果：aml_encrypt_g12b bootmk 报 "FW file ddr4_1d.fw magic error!"
#
# 本 workflow 逐个测试组合，找出能跑通的那套。
#
# 手动触发可选 enc 覆盖：
#   enc=vendor    用仓库里的 aml_encrypt_g12b（厂商SDK 版,1917168 B）
#   enc=libreelec 用 fip/_alt/aml_encrypt_g12b.libreelec（1750647 B）
# =============================================================================
name: fip-test

on:
  push:
    paths:
      - 'fip/**'
      - '.github/workflows/fip-test.yml'
  workflow_dispatch:
    inputs:
      enc:
        description: '用哪个 aml_encrypt'
        required: false
        default: vendor
        type: choice
        options: [vendor, libreelec]

jobs:
  fip:
    name: FIP assembly test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show FIP inventory
        run: |
          set -eu
          cd fip/halo-a311d
          echo "--- 文件清单 +md5 ---"
          md5sum *.fw *.bin *.img 2>/dev/null | head -25
          echo "--- aml_encrypt_g12b 架构 ---"
          file aml_encrypt_g12b || true
          echo "--- 对照 LibreELEC 官方(用于定位差异) ---"
          for f in aml_encrypt_g12b bl2.bin bl30.bin bl31.img ddr4_1d.fw; do
            ours=$(md5sum "$f" 2>/dev/null | cut -d' ' -f1)
            echo "  $f = $ours"
          done

      - name: Prepare test tree
        run: |
          set -eu
          T="$RUNNER_TEMP/fiptest"
          rm -rf "$T"; mkdir -p "$T"
          cp -a fip/halo-a311d/. "$T/"
          cd "$T"
          chmod +x blx_fix.sh aml_encrypt_g12b acs_tool.py

          ENC="${{ github.event.inputs.enc || 'vendor' }}"
          if [ "$ENC" = "libreelec" ]; then
            echo ">>> 换用 LibreELEC 版aml_encrypt_g12b"
            cp fip/_alt/aml_encrypt_g12b.libreelec "$T/aml_encrypt_g12b" 2>/dev/null || {
              echo "::error::_alt 里没有 LibreELEC 版encrypt"; exit 1; }
          fi
          chmod +x aml_encrypt_g12b
          echo ">>> 使用: $ENC"
          md5sum aml_encrypt_g12b
          file aml_encrypt_g12b

      - name: Run blx_fix (bl30/bl2 padding)
        run: |
          set -eux
          cd "$RUNNER_TEMP/fiptest"
          # 顺序照 meson64_common.inc:122-134
          ./blx_fix.sh bl30.bin zero_tmp bl30_zero.bin bl301.bin bl301_zero.bin bl30_new.bin bl30
          ./blx_fix.sh bl2.bin  zero_tmp bl2_zero.bin  acs.bin   bl21_zero.bin bl2_new.bin  bl2
          ls -la bl30_new.bin bl2_new.bin

      - name: Encrypt bl30/bl31/bl33/bl2
        run: |
          set -eux
          cd "$RUNNER_TEMP/fiptest"
          cp "$GITHUB_WORKSPACE/output/u-boot.bin" . 2>/dev/null || \
            echo "(没有现成 u-boot.bin，用空文件占位——只测 encrypt 是否接受输入格式)"
          touch bl33.bin
          ./aml_encrypt_g12b --bl30sig --input bl30_new.bin --output bl30_new.bin.g12.enc --level v3
          ./aml_encrypt_g12b --bl3sig --input bl30_new.bin.g12.enc --output bl30_new.bin.enc --level v3 --type bl30
          ./aml_encrypt_g12b --bl3sig --input bl31.img --output bl31.img.enc --level v3 --type bl31
          ./aml_encrypt_g12b --bl3sig --input bl33.bin --compress lz4 --output bl33.bin.enc --level v3 --type bl33
          ./aml_encrypt_g12b --bl2sig --input bl2_new.bin --output bl2.n.bin.sig
          ls -la *.enc *.sig

      - name: bootmk (这里就是 magic error 的地方)
        run: |
          set -eux
          cd "$RUNNER_TEMP/fiptest"
          ./aml_encrypt_g12b bootmk --output u-boot.bin \
            --bl2 bl2.n.bin.sig \
            --bl30 bl30_new.bin.enc \
            --bl31 bl31.img.enc \
            --bl33 bl33.bin.enc \
            --ddrfw1 ddr4_1d.fw \
            --ddrfw2 ddr4_2d.fw \
            --ddrfw3 ddr3_1d.fw \
            --ddrfw4 piei.fw \
            --ddrfw5 lpddr4_1d.fw \
            --ddrfw6 lpddr4_2d.fw \
            --ddrfw7 diag_lpddr4.fw \
            --ddrfw8 aml_ddr.fw \
            --ddrfw9 lpddr3_1d.fw \
            --level v3
          echo "=== FIP 组装成功 ==="
          ls -la u-boot.bin
          file u-boot.bin
