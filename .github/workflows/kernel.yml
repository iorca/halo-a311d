# =============================================================================
# halo-a311d —— Armbian 内核编译
#
# runner: GitHub 官方原生 ARM64（ubuntu-24.04-arm），无需自托管/ QEMU
#   2025 起 GitHub 提供 arm64 公开 runner，标签 ubuntu-24.04-arm
#
# 流程:
#   1. checkout 本仓库
#   2. clone armbian/build
#      ⚠ 官方 .gitignore 第19 行排除 /userpatches（约定为本地覆盖），
#         要把注入结果提交/使用必须先去掉该行
#   3. scripts/deploy-to-build.sh 注入板级文件
#   4. compile.sh kernel BOARD=halo-a311d BRANCH=current
#
# 缓存策略:
#   内核源码树最大(~10GB)，只缓存 armbian 的 cache/sources
#   armbian 支持增量编译，命中缓存后第二次快很多
#
# 手动触发可改target:
#   target=kernel    只编内核 deb（默认）
#   target=uboot     只编 u-boot
#   target=rootfs    只编 rootfs
#   target=firmware  只编固件
#   target=build     全部 artifact（**完整镜像在这里**，~2h）
#
# ⚠⚠ armbian 的 target 必须来自 lib/functions/cli/commands.sh 的别名表：
#   kernel / kernel-dtb / uboot / rootfs / firmware / build / dts-check ...
#   **没有 image，也没有 full_firmware**（那只是 artifact-*.sh 的函数名前缀，
#   不能直接当命令用）。传错报 'Unknown argument xxx' + exit 43。
#   完整镜像 = ./compile.sh build BOARD=halo-a311d
# =============================================================================
name: kernel-build

# ⚠ 连续 push 时取消上一次构建 —— 每次完整编译 50+ 分钟，
#   连推几个 commit 就是几小时的空转。
#   push / PR 触发时立即取消旧的；workflow_dispatch 手动触发不取消。
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  push:
    branches: [main]
    # ⚠ tags: 推 tag 时触发 → 编译完整镜像并发布 GitHub Release
    #   'v*'  如 v1.0.0 / v2026.10.20
    #   注意：推 tag 时不看 paths，下面用 if 过滤只对 tag 跑 build
    tags: ['v*']
    paths:
      - 'dt/**'
      - 'config/**'
      - 'fip-blob/**'
      - 'boot/**'
      - 'scripts/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标（armbian 的 artifact 名）'
        required: true
        default: kernel
        type: choice
        options:
          - kernel    # 只编内核 deb（~51 min，默认）
          - build     # 完整镜像：内核 + rootfs + 镜像（~78 min）
          - uboot     # 只编 u-boot
          - rootfs    # 只编 rootfs
          - firmware  # 只编固件包
      release:
        description: 'rootfs 发行版（target=rootfs/build 时必填）'
        required: false
        default: noble
        type: choice
        options: [noble, bookworm, trixie, jammy]
      tag:
        description: 'Release 的 tag 名（仅 target=build 时有效；留空自动生成 build-<日期>-<sha8>）'
        required: false
        type: string
  schedule:
    # 每周一早上 6 点增量重建（cron: '0 6 * * 1'）
    - cron: '0 6 * * 1'

env:
  BOARD: halo-a311d
  BRANCH: current
  FAMILY: meson-g12b
  # ⚠ 必须与 armbian 的 KERNELPATCHDIR 一致：archive/meson64-6.18（BRANCH=current）
  KERNEL_SUBDIR: archive/meson64-6.18
  # ================================================================
  # ⚠⚠ TARGET_KIND = 本次真正要构建的目标，**只在这里算一次**
  #   - 推 tag     → build（必须出镜像，Release 里要带 .img）
  #   - dispatch   → 用户选的 target
  #   - push / 定时任务 → kernel
  #
  # 之前 Build kernel 步骤自己算了一遍 tag→build，而 Collect artifacts
  # 只看 inputs.target，**两边漂移**：tag 发布时实际在跑 build，
  # 却按 kernel 的清单校验 → 镜像丢了也照样绿。
  # 集中一处，杜绝再次漂移。
  # ================================================================
  TARGET_KIND: ${{ github.ref_type == 'tag' && 'build' || github.event.inputs.target || 'kernel' }}

jobs:
  kernel:
    name: Kernel (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    # 发 GitHub Release 需要 contents: write。
    # ⚠ 这个键**只能写在 workflow / job 级**，step 级写了 GitHub 会直接
    #   报 "Unexpected value 'permissions'" 且整个 workflow 无法解析（不跑任何 job）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Show environment
        run: |
          set -eu
          echo "arch  : $(uname -m)"
          echo "kernel: $(uname -r)"
          echo "target: $TARGET_KIND"
          # ⚠ job 级 env: 不会成为 shell 环境变量，必须写进 GITHUB_ENV
          #   否则后续步骤里 $BUILD_DIR 会报unbound variable
          echo "BUILD_DIR=$GITHUB_WORKSPACE/armbian-build" >> "$GITHUB_ENV"
          echo "USERPATCHES_PATH=$GITHUB_WORKSPACE/armbian-build/userpatches" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$GITHUB_WORKSPACE/armbian-build"
          echo "USERPATCHES_PATH=$GITHUB_WORKSPACE/armbian-build/userpatches"
          nproc || echo "nproc unavailable"
          free -h || true

      - name: Install build dependencies
        # ⚠ 只装armbian 主机侧工具（编译脚本/build 工具）。
        #   交叉编译器由 armbian 的 toolchain 自动获取，硬装反而版本不匹配：
        #     - python2 在 Ubuntu 24.04 已移除
        #     - gcc-12-aarch64-linux-gnu 在 24.04 不存在（默认 gcc-13/14）
        run: |
          set -eu
          # ⚠ DEBIAN_FRONTEND + Dpkg::Use-Pty=0 与 armbian 内部保持一致，
          #   避免 dpkg 试图开 pty 产生额外输出。
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get -o Dpkg::Use-Pty=0 install -y -qq --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev \
            python3 python3-dev python3-setuptools python3-pip python3-venv \
            rsync cpio kmod zip unzip xz-utils \
            device-tree-compiler u-boot-tools \
            ca-certificates curl wget \
            file \
            qemu-user-static \
            libc6-amd64-cross
          # ⚠⚠ file + qemu-user-static + libc6-amd64-cross 是 **必需**的：
          #   FIP 组装要跑 aml_encrypt_g12b，它是 **x86-64 ELF**
          #   （e_machine=0x3e），而本runner 是 ARM64。
          #   armbian 的 run_host_x86_binary_logged() 会：
          #     1. 用 `file` 判断目标架构
          #     2. 非 x86 时改用 /usr/bin/qemu-x86_64-static 跑
          #     3. 动态链接时还要 -L /usr/x86_64-linux-gnu（由 libc6-amd64-cross 提供）
          #   缺任何一个 → FIP 组装失败，症状是
          #   "FW file ddr4_1d.fw magic error!" + "aml_encrypt_g12b bootmk fail"
          for t in git bc bison flex dtc rsync cpio python3 file; do
            command -v "$t" || { echo "::error::$t 缺失"; exit 1; }
          done
          # qemu-x86_64 的两种命名都要接受
          if [ -x /usr/bin/qemu-x86_64-static ]; then
            echo "qemu: /usr/bin/qemu-x86_64-static"
          elif [ -x /usr/bin/qemu-x86_64 ]; then
            echo "qemu: /usr/bin/qemu-x86_64"
          else
            echo "::error::缺 qemu-x86_64（装 qemu-user-static）"
            exit 1
          fi
          # /usr/x86_64-linux-gnu 只对**动态链接**的 x86 程序有意义；
          # aml_encrypt_g12b 是 statically linked（file 已确认），走 qemu 即可，
          # 不需要它。所以这里只记录，不报警 —— 之前用 ::warning:: 会污染
          # Annotations 面板，而实际从未影响过构建。
          [ -d /usr/x86_64-linux-gnu ] && echo "x86_64 libs: present" \
            || echo "x86_64 libs: absent (ok, aml_encrypt is static)"
          dtc --version
          echo "arch: $(uname -m)"

      # =====================================================================
      # 缓存（实测耗时分布：拉源码 2min / 编译 45min / rootfs+镜像 27min）
      #
      # 1) sources —— 源码 clone（内核树约 10GB，省首次 clone 十几分钟）
      #    ⚠ key **绝不能带 hashFiles('dt/**')**：改一次 dts 就整树失效重下，
      #      dts 不影响源码树。
      #    ⚠ 也不**只用**上游 SHA 做 key：SHA 一变就 miss，得不偿失。
      #      用「固定 v4 + SHA」两段式：
      #        - 命中 v4 前缀 → armbian 自己 git fetch 增量更新（几秒）
      #        - SHA 也匹配  → 全新缓存（上游大更新时）
      # 2) apt —— 编译依赖（gcc、bc、flex、qemu-user-static 等）
      #
      #❌ 不用 ccache（2026-10-20 实测确认无效）：
      #   实测 ccache 缓存目录编译前后都是 224 KiB，命中率统计一条没有，
      #   实际编译命令里也没有 ccache 前缀（`ccache /usr/bin/aarch64-...` 出现 0 次）。
      #   原因：GitHub 官方 runner 是**无状态 ephemeral 容器**，每次全新；
      #   ccache 依赖跨 run 的本地缓存目录，而 actions/cache 有 10GB 硬上限 +
      #   保存时机在 job 末尾，编译产物能否落盘不可控。
      #   → 已移除相关步骤与 ENABLE_EXTENSIONS=ccache，减少误导。
      #   → 真要加速内核编译，只能用自托管 runner 或 ccache-remote（需外部 Redis）。
      # =====================================================================
      - name: Resolve armbian upstream SHA
        id: armbian_sha
        run: |
          set -eu
          SHA=$(git ls-remote https://github.com/armbian/build.git HEAD | cut -f1)
          echo "armbian/build HEAD = ${SHA:0:12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache armbian sources
        uses: actions/cache@v5
        with:
          path: armbian-build/cache/sources
          key: arm-sources-v4-${{ env.BRANCH }}-${{ env.FAMILY }}-${{ steps.armbian_sha.outputs.sha }}
          # 第一优先前缀：命中任意历史缓存 → armbian 自己增量 fetch（几秒）
          restore-keys: |
            arm-sources-v4-${{ env.BRANCH }}-${{ env.FAMILY }}-

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/apt
            ~/.cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/kernel.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone armbian/build
        run: |
          set -eux
          B="$GITHUB_WORKSPACE/armbian-build"
          # ⚠ actions/cache 会先恢复 cache/sources（目录已存在且非空），
          #   直接 git clone 报 "destination path already exists and is not an empty directory"
          #   → 只在缺失时 clone；已存在则增量更新
          if [ -d "$B/.git" ]; then
            echo "已存在 clone，增量更新"
            git -C "$B" fetch --depth 1 origin main
            git -C "$B" reset --hard origin/main
            git -C "$B" clean -fd
          else
            if [ -d "$B" ] && [ -n "$(ls -A "$B" 2>/dev/null)" ]; then
              echo "目标目录非空(cache 恢复)，先保留 cache/sources"
              mkdir -p /tmp/keep
              [ -d "$B/cache/sources" ] && mv "$B/cache/sources" /tmp/keep/sources || true
              rm -rf "$B"
              git clone --depth 1 https://github.com/armbian/build.git "$B"
              mkdir -p "$B/cache"
              [ -d /tmp/keep/sources ] && mv /tmp/keep/sources "$B/cache/sources" || true
            else
              git clone --depth 1 https://github.com/armbian/build.git "$B"
            fi
          fi
          # 官方排除 /userpatches，要提交注入结果必须去掉
          sed -i 's|^/userpatches$|# /userpatches (CI: injected)|' "$B/.gitignore"
          mkdir -p "$B/userpatches"
          echo "--- .gitignore 中的 userpatches 规则 ---"
          grep -n "userpatches" "$B/.gitignore" || echo "(已移除)"

      - name: Inject board files
        run: |
          set -eux
          chmod +x scripts/deploy-to-build.sh
          ./scripts/deploy-to-build.sh $GITHUB_WORKSPACE/armbian-build
          echo "--- 注入结果校验 ---"
          test -f $GITHUB_WORKSPACE/armbian-build/userpatches/config/boards/${{ env.BOARD }}.conf
          test -f $GITHUB_WORKSPACE/armbian-build/userpatches/config/sources/families/meson-g12b.conf
          test -f $GITHUB_WORKSPACE/armbian-build/userpatches/kernel/${{ env.KERNEL_SUBDIR }}/dt/meson-halo-a311d.dts
          # FIP 不再自己维护 —— armbian 会自动 fetch LibreELEC 的 khadas-vim3 目录
          # （board conf 里的 post_uboot_custom_postprocess__halo_a311d_uboot hook指定）
          echo "✓ 板级文件已就位（FIP 由 armbian 自动 fetch LibreELEC khadas-vim3）"

      - name: Build kernel
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/armbian-build"
          export USERPATCHES_PATH="$GITHUB_WORKSPACE/armbian-build/userpatches"
          # tag → build（出完整镜像，Release 里要有 .img）
          #   实测 target=build 78min，其中 27min 花在 rootfs+镜像打包上。
          #   日常开发用 workflow_dispatch -f target=kernel（51min，只出 deb）。
          # ⚠ 统一取自 job 级 env TARGET_KIND —— 与 Collect artifacts 同源，
          #   不允许再在这里另算一遍（tag 时两边不一致的老 bug 就是这么来的）。
          TGT="$TARGET_KIND"
          # ⚠ 必须禁Docker —— 'build' / 'rootfs' 这类 target 会尝试拉
          #   armbian/build 的 Docker 镜像跑 chroot，GitHub runner 上没 Docker
          #   → "Docker run failed after 71s" + exit 43
          #   kernel target 之所以能过，是因为它不需要 chroot。
          export PREFER_DOCKER=no
          export DOCKER=no
          # ⚠ 原 export SKIP_ARMBIAN_IMAGE=yes 已删除：
          #   在 armbian/build 里**根本不存在这个变量**
          #   （gh search code SKIP_ARMBIAN_IMAGE repo:armbian/build → total_count=0）。
          #   留着只会误导，且万一哪天真被 armbian 实现，会直接把 build 的镜像步骤跳掉。
          # ⚠⚠ 必须禁交互 —— 'build' 会弹 dialog 菜单（内核配置选择），
          #   CI 里 stdin 不是 tty → "stdin is not a terminal. can't use dialog" + exit 43
          #   KERNEL_CONFIGURE=no 是 armbian 官方 config 模板里的推荐值
          export KERNEL_CONFIGURE=no
          export BUILD_ONLY=""
          # ⚠⚠ build 有三个交互点，CI 里必须全部预设，否则弹 dialog 死掉：
          #   1. release                → RELEASE=noble（见下）
          #   2. 桌面版还是服务器版      → BUILD_DESKTOP=no
          #      (interactive.sh:371 interactive_config_ask_desktop_build)
          #   3. standard 还是 minimal   → BUILD_MINIMAL=yes
          #      (interactive.sh:382 interactive_config_ask_standard_or_minimal
          #       第385行 [[ -n $BUILD_MINIMAL ]] && return 0 —— 设了就不问)
          #
          # 选 minimal：不含 packages.additional，体积小，适合板子
          export BUILD_DESKTOP=no
          export BUILD_MINIMAL=yes
          # 本板无视频输出，声明后连桌面选项都不会问
          export HAS_VIDEO_OUTPUT=no
          echo ">>> compile.sh $TGT BOARD=${{ env.BOARD }} BRANCH=${{ env.BRANCH }}"
          #⚠ RELEASE 是 rootfs/build 的必填参数，
          #   缺了报 "Param 'RELEASE' is not set but needs to be set for rootfs CLI"
          if [ "$TGT" = "rootfs" ] || [ "$TGT" = "build" ]; then
            REL="${{ github.event.inputs.release || 'noble' }}"   # tag 事件无输入，回落 noble
            echo ">>> target=$TGT 需要 RELEASE=$REL"
            ./compile.sh "$TGT" \
              BOARD="${{ env.BOARD }}" \
              BRANCH="${{ env.BRANCH }}" \
              RELEASE="$REL"
          else
            ./compile.sh "$TGT" \
              BOARD="${{ env.BOARD }}" \
              BRANCH="${{ env.BRANCH }}"
          fi

      - name: Collect artifacts
        # ⚠ TARGET_KIND 取自 **job 级 env**，这里**不许**再重定义
        #   —— 上次就是这里重定义一个只看 inputs.target 的版本，
        #      导致推 tag 时实际在跑 build、却按 kernel 的清单校验。
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/armbian-build"
          mkdir -p out-halo
          echo ">>> target=$TARGET_KIND"

          # ⚠ armbian 会把 userpatches 的 dts 用 **BOARD 名**重命名后再编 dtb，
          #   产物叫 halo-a311d.dtb / halo-a311d-pcie.dtb，
          #   而不是 meson-halo-a311d*.dtb —— 两种名字都要找。
          echo "--- 查找本板 dtb ---"
          find . -name '*halo-a311d*.dtb' 2>/dev/null | tee /tmp/dtb-list.txt || true
          if [ -s /tmp/dtb-list.txt ]; then
            while read -r f; do
              cp "$f" out-halo/
              echo "  收集: $f"
            done < /tmp/dtb-list.txt
            ls -la out-halo/
          else
            echo "userpatches dt 目录:"
            ls -la userpatches/kernel/*/dt/ 2>/dev/null || true
            echo "内核树 amlogic 目录:"
            ls cache/sources/linux-kernel-worktree/*/arch/arm64/boot/dts/amlogic/ 2>/dev/null \
              | grep -i halo || echo "内核树里没有 halo-a311d 相关文件"
            # ⚠⚠ 硬失败，不能用 ::error:: —— 那只生成注解，步骤照样 exit 0
            #   （2026-10-20 踩过：target=firmware 时只出固件包，job 却显示 success）
            if [ "$TARGET_KIND" = "kernel" ] || [ "$TARGET_KIND" = "build" ]; then
              echo "::error::未找到任何 *halo-a311d*.dtb —— 板级 dts 没进内核"
              exit 1
            else
              echo "(target=$TARGET_KIND，不要求 dtb)"
            fi
          fi

          # 解包 linux-dtb deb，确认 dtb 真的在里面
          DTB_DEB=$(find output -name 'linux-dtb-*.deb' | head -1 || true)
          if [ -n "$DTB_DEB" ]; then
            echo "--- linux-dtb deb 内 halo 相关内容 ---"
            dpkg-deb -c "$DTB_DEB" 2>/dev/null | grep -i halo || \
              echo "(该 deb 内没有 halo-a311d.dtb)"
          fi

          # 完整镜像（target=full_firmware 时才有）
          if [ -d output/images ]; then
            echo "--- 完整镜像 ---"
            find output/images -type f \( -name '*.img' -o -name '*.7z' -o -name '*.xz' \) \
              -exec ls -la {} \; | head -20
            mkdir -p out-halo/image
            cp -a output/images/. out-halo/image/ 2>/dev/null || true
          else
            echo "(无 output/images —— target=kernel 正常现象)"
          fi

          # rootfs
          if [ -d output/rootfs ]; then
            echo "--- rootfs 产物 ---"
            find output/rootfs -maxdepth 2 -name '*.tar*' -o -maxdepth 2 -name '*.zst' | head -10
          fi

          echo "--- deb 清单 ---"
          find output -name '*.deb' 2>/dev/null | head -20 || echo "无 deb 产出"

          # ================================================================
          # ⚠⚠ 产物类型硬校验
          #
          # 背景（2026-10-20 踩过）：target=firmware 只编了 armbian-firmware
          # deb（164MB 固件包），**内核一个都没编**，但整个 job 显示 success。
          # 原因是 ::error:: 只生成注解，不会让步骤失败。
          #
          # 所以这里按 target 显式检查必需产物，缺了就 exit 1。
          # ================================================================
          # require <描述> <搜索根> <pattern...>
          #
          # ⚠ 搜索根必须显式给 —— 各 target 的产物**不在同一个目录**：
          #     kernel / uboot / firmware / build 的 deb 与 img → output/
          #     **rootfs 的归档在 cache/rootfs/，不在 output/**
          #       armbian lib/functions/artifacts/artifact-rootfs.sh:100
          #         artifact_final_file="${SRC}/cache/rootfs/${artifact_name}_...tar.zst"
          #     只搜 output 的话，rootfs 明明成功却被判失败。
          #
          # ⚠ 允许多 pattern —— 镜像可能被 armbian 压缩：
          #     lib/functions/image/compress-checksum.sh:207,211
          #     COMPRESS_OUTPUTIMAGE 含 xz|zst → 产出 .img.xz / .img.zst，
          #     裸 .img 会被删掉，只认 '*.img' 会误报。
          require() {
            local what="$1" root="$2" found="" pat
            shift 2
            local -a pats=("$@")
            for pat in "${pats[@]}"; do
              found=$(find "$root" -name "$pat" -type f 2>/dev/null | head -1)
              [ -n "$found" ] && break
            done
            if [ -z "$found" ]; then
              echo "::error::target=$TARGET_KIND 但缺少 $what（在 $root 下找 ${pats[*]}）"
              echo "--- $root 实际产出 ---"
              find "$root" -maxdepth 3 -type f 2>/dev/null | head -20 || echo "(目录不存在)"
              exit 1
            fi
            echo "  ✓ $what: $found"
          }

          case "$TARGET_KIND" in
            kernel)
              require "内核 image deb" output 'linux-image-*.deb'
              require "内核 headers deb" output 'linux-headers-*.deb'
              require "内核 dtb deb" output 'linux-dtb-*.deb'
              ;;
            build)
              require "内核 image deb" output 'linux-image-*.deb'
              require "完整镜像" output '*.img' '*.img.xz' '*.img.zst' '*.7z'
              ;;
            uboot)
              # armbian lib/functions/artifacts/artifact-uboot.sh:154
              #   artifact_map_packages=(["uboot"]="linux-u-boot-${BOARD}-${BRANCH}")
              #   → linux-u-boot-halo-a311d-current_*.deb
              require "u-boot deb" output 'linux-u-boot-*.deb'
              ;;
            rootfs)
              # ⚠ cache/rootfs，不是 output —— 见 require() 上方注释
              require "rootfs 归档" cache/rootfs '*.tar.zst' '*.tar.xz'
              ;;
            firmware)
              require "固件 deb" output 'armbian-firmware*.deb'
              ;;
            *)
              # 没有校验规则 = 无法证明成功，宁可失败也不给假绿灯
              echo "::error::未知 target=$TARGET_KIND —— 无对应产物校验规则，无法判断是否真成功"
              exit 1
              ;;
          esac
          echo ">>> 产物校验通过（target=$TARGET_KIND）"

      - name: Verify the built DTB against upstream A311D OPP tables
        # ⚠⚠⚠ 这是**唯一**能抓住「armbian 的 OPP patch 污染了产物」的检查。
        #
        # dtb-check 的 OPP 检查（第 5 道）编译的是「板级 DTS + **未打 patch 的**
        # 上游 dtsi」→ 永远只有 7/11 档。armbian 的 patch 只存在于 armbian 的
        # 内核树里，dtb-check 根本没碰过它。
        #   → 2026-10-21 的 Release 产物实测 9 档 / 13 档（顶 2.4GHz/1040mV），
        #     而 dtb-check 全程绿灯。**产物级**检查才能堵住。
        #
        # 这里比的是**这次真的编出来的 dtb**（out-halo/ 里的），期望值取自
        # **未打 patch 的上游**（从 kernel.org stable 的 GitHub 镜像取，
        # 与 armbian 构建时用的是同一个源）。
        #
        # 期望值绝不能取自 armbian 打过 patch 的内核树 —— 那样就是「自己跟
        # 自己比」，被污染时照样全绿（这正是 dtb-check 抓不到的原因）。
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/armbian-build"

          # 本板内核的 dtb（两个变体）
          DTBS=$(find out-halo -maxdepth 1 -name '*halo-a311d*.dtb' 2>/dev/null || true)
          if [ -z "$DTBS" ]; then
              echo "::notice::out-halo 里没有本板 dtb（target=$TARGET_KIND 不产 dtb），跳过 OPP 产物校验"
              exit 0
          fi

          # ⚠ 取**未打 patch** 的上游 dtsi
          #   armbian 构建时的内核源（构建日志里的 change-tracking）：
          #     https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          #     branch linux-6.18.y
          #   这里用它的 GitHub 镜像 gregkh/linux 的同名分支，取到的内容一致。
          #   不能用 armbian 那棵树 —— 它已经被 patch 改过了。
          REFDIR="$RUNNER_TEMP/upstream-dtsi"
          mkdir -p "$REFDIR"
          BASE="https://raw.githubusercontent.com/gregkh/linux/linux-6.18.y/arch/arm64/boot/dts/amlogic"
          for f in meson-g12b-a311d.dtsi meson-g12b-khadas-vim3.dtsi; do
              curl -fsSL --retry 3 --max-time 60 "$BASE/$f" -o "$REFDIR/$f" || {
                  echo "::error::取不到上游参考 $f"
                  exit 1
              }
              test -s "$REFDIR/$f" || { echo "::error::上游参考 $f 是空文件"; exit 1; }
          done
          echo "--- 上游参考（未打 patch）---"
          echo "  opp-hz 条数: $(grep -c 'opp-hz' "$REFDIR/meson-g12b-a311d.dtsi")"

          fail=0
          for d in $DTBS; do
              echo "::group::产物 OPP 校验 $(basename "$d")"
              if ! python3 "$GITHUB_WORKSPACE/scripts/check-opp-tables.py" \
                   "$d" "$REFDIR/meson-g12b-a311d.dtsi" "$REFDIR/meson-g12b-khadas-vim3.dtsi"; then
                  fail=1
              fi
              echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
              echo "::error::产物 dtb 的 CPU OPP 表与上游 A311D 不一致 —— 不要发布这个产物"
              echo "::error::最可能的原因：armbian 的 CPU OPP 追加 patch 生效了"
              echo "::error::（它在 common 层，对所有 meson64 板无条件生效）"
              exit 1
          fi
          echo ">>> 产物 OPP 表与上游一致（$TARGET_KIND）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          # ⚠ 必须与 TARGET_KIND 同源：以前这里单独用 inputs.target，
          #   推 tag 时实际跑的是 build，产物包名却叫 ...-kernel，看名字分不清。
          name: halo-a311d-${{ env.TARGET_KIND }}
          path: |
            armbian-build/out-halo/*.dtb
            armbian-build/out-halo/image/**
            armbian-build/output/**/*.deb
            armbian-build/output/**/*.deb.*
          retention-days: 30
          # ⚠ warn 会让「一个文件都没传上去」也显示绿灯 —— 已知假绿源之一。
          #   require() 已保证 output/ 里有对应产物，这里应当是必中条件。
          if-no-files-found: error

      # =====================================================================
      # GitHub Release 发布 —— **只有产出「可刷写镜像」时才发**
      #
      # 为什么要发 Release 而不是只留 artifact：
      #   artifact 只在 Actions 里存 30 天，且必须登录才能下。
      #   Release 是永久的、可匿名 wget 直链、还能写更新说明 —— 镜像就该放这。
      #
      # ⚠⚠ 判据是**产物性质**，不是触发方式：
      #   五个 target 里只有 build 会产出 .img，也只有它刷得进机器。
      #   kernel / uboot / rootfs / firmware 出的都是 deb 或归档，
      #   发成 Release 没有意义 —— 所以它们不发布。
      #
      #   等价于 TARGET_KIND == 'build'。这里刻意不写 env.TARGET_KIND：
      #   step 的 if 里若拿不到 env 会**静默判 false**，Release 永远不发且无报错，
      #   而本项目已经被「::error:: 不影响退出码」「|| true 吞掉失败」坑过两回，
      #   不在关键路径上引入依赖求值顺序的写法。用 github/inputs 直接算。
      #   （真正的兜底是下面那句 IMAGES 空值检查 —— 真出意外会 exit 1 而不是静默跳过）
      #
      #   - 推 tag                  → 发（TARGET_KIND 被强制为 build）
      #   - dispatch  target=build  → 发
      #   - push main / 定时任务    → TARGET_KIND=kernel → 不发
      #
      # 两种发版方式：
      #   1) 推 tag（会新建 tag，语义最正式）
      #      git tag -a v2026.10.21-mainline -m "..." && git push origin v2026.10.21-mainline
      #   2) dispatch target=build（不新建 tag，省一步）
      #      可选填 tag 名；留空则自动生成 build-<日期>-<sha8>
      # =====================================================================
      - name: Publish GitHub Release
        # ⚠ permissions 不能写在 step 级（GitHub 会报 Unexpected value），
        #   已挪到 job 级。step 级只支持 name/if/env/run/with/...
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'build')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/armbian-build"

          # ----------------------------------------------------------
          # TAG 的来源 —— 这里**不能**直接用 ${{ github.ref_name }}：
          #   tag 推送时 ref_name 就是 tag 名，没问题；
          #   但 dispatch 时 ref_name 是**分支名**（如 gxlimg-full-mainline-uboot），
          #   直接拿去 gh release create 会在分支名上建 Release —— 错的。
          # ----------------------------------------------------------
          if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
          else
              TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          export TAG
          echo "=== 发布 tag: $TAG ==="

          echo "=== 待发布文件 ==="
          ls -la out-halo/ 2>/dev/null || echo "(out-halo 为空)"
          IMAGES=$(find out-halo/image -maxdepth 1 -type f \( -name '*.img' -o -name '*.xz' -o -name '*.gz' -o -name '*.zst' -o -name '*.7z' \) 2>/dev/null || true)
          DTBS=$(find out-halo -maxdepth 1 -name '*.dtb' 2>/dev/null || true)

          # ================================================================
          # ⚠⚠ 这里是**唯一的真兜底**：判断"这次到底有没有可刷镜像"
          #
          #  原来的判断是 `if [ -z "$IMAGES" ] && [ -z "$DTBS" ]`：
          #  build 一定会出 dtb，DTBS 永不为空 → 条件永远不成立
          #  → **就算镜像没编出来也会照样发 Release**，
          #    发一个只有两个 dtb、没有可刷镜像的版本。
          #
          #  改成只判 IMAGES 后缺失即 exit 1 —— 这条比上面的 if 更可靠，
          #  不依赖任何表达式求值顺序。哪怕 if 条件将来被改坏，这里也会拦住。
          # ================================================================
          if [ -z "$IMAGES" ]; then
            echo "::error::Release 必须包含镜像，但 out-halo/image 里没有任何 img/xz/gz/zst/7z"
            echo "--- out-halo 实际内容 ---"
            ls -laR out-halo/ 2>/dev/null | head -30
            exit 1
          fi
          if [ -z "$DTBS" ]; then
            echo "::error::Release 缺少 dtb（target=$TARGET_KIND 应有 *halo-a311d*.dtb）"
            exit 1
          fi

          # 收集产物到临时目录
          # ⚠ 加 tag 前缀：两个分支产出的镜像文件名完全相同
          #   （Armbian_..._Halo-a311d_noble_current_6.18.57_minimal.img），
          #   不加前缀在 Releases 页面根本分不出哪个是主线 u-boot 版本。
          STAGE="$RUNNER_TEMP/release"
          mkdir -p "$STAGE"
          for f in $IMAGES $DTBS; do
            base="$(basename "$f")"
            cp -a "$f" "$STAGE/${TAG}-${base}"
          done
          # deb 也放进去（可选，但便于单独取内核包）
          find output -name '*.deb' 2>/dev/null | head -10 | while read -r d; do
            cp -a "$d" "$STAGE/"
          done

          echo
          echo "=== 发布清单 ==="
          ls -la "$STAGE"

          # 判断 u-boot 来源（board conf 用哪个 FIP 方案）
          if grep -q "gxlimg_repack_fip_with_new_uboot" \
               "$GITHUB_WORKSPACE/config/boards/halo-a311d.conf" 2>/dev/null; then
            UBOOT_KIND="**主线 u-boot** (gxlimg 重打包厂商 FIP, v2026.04)"
          else
            UBOOT_KIND="LibreELEC khadas-vim3 FIP (含厂商原版 u-boot)"
          fi
          echo ">>> u-boot 来源: $UBOOT_KIND"

          # ================================================================
          # ⚠⚠⚠ tag 必须指向「本次构建的 commit」
          #
          # 背景（2026-10-22 查出的真 bug）：
          #   `gh release create` 在 **tag 不存在** 时，会让 GitHub 用
          #   **默认分支的 HEAD** 建这个 tag
          #   （gh 源码 pkg/cmd/release/create/create.go：
          #     opts.Target → API 的 target_commitish，**缺省 = default branch**）。
          #
          #   本仓库默认分支是 main，而 mainline 发行线的代码在
          #   gxlimg-full-mainline-uboot 分支上
          #   → 两条线的 tag 全指向 main 的 commit。
          #   实测 10.22：v2026.10.22-libreelec 和 v2026.10.22-mainline
          #     **都**指向 44d73fa（= main 的 commit），
          #     而 mainline 的产物是 ba4940b（gxlimg 分支）编出来的。
          #
          #   后果：Release 页面 "Source code" 下载到的是 main 的代码，
          #         与产物对不上 —— 而 CI 全程绿灯，没有任何检查会报。
          #
          # 现在自己管 tag（不依赖 gh 的 target_commitish 缺省行为）：
          #   · tag 不存在              → 用 API 建（annotated，带说明）
          #   · tag 存在且指向同一 commit → 不动
          #   · tag 存在但指向别的 commit → 强制移动
          #     （同一个 tag 名重跑一次构建就是这个场景；
          #       Release 本来就会被删掉重建，tag 必须跟着**新产物**走）
          #
          # 期望 commit 一律取 $GITHUB_SHA —— 它就是本次构建用的那个 commit
          #（dispatch 时 = 被 dispatch 的分支 HEAD；tag 推送时 = 该 tag 指向的 commit）。
          # ================================================================
          REPO_API="repos/${{ github.repository }}"
          TAG_REF="refs/tags/$TAG"

          # 查远端现有 tag 指向哪个 commit（annotated tag 要剥两层）
          #
          # ⚠⚠⚠ 必须靠**退出码**判断 tag 存不存在，**不能**靠 stdout 是否为空：
          #   gh api 在 404 时把错误 JSON（{"message":"Not Found",...}）
          #   打到 **stdout**（不是 stderr！），而且 --jq 对错误输出不生效。
          #   → `$(gh api ... --jq .object.sha 2>/dev/null || echo "")` 拿到的是
          #     那段错误 JSON 字符串，不是空 → 会被误判成"tag 存在"。
          #   实测踩过：拿错误 JSON 当 sha 去查 → 报 "Reference does not exist"。
          #
          # 正确做法：先看退出码，成功了再取 --jq 的值。
          existing_commit=""
          if existing_sha=$(gh api "$REPO_API/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
              existing_type=$(gh api "$REPO_API/git/ref/tags/$TAG" --jq '.object.type' 2>/dev/null || echo "commit")
              if [ "$existing_type" = "tag" ]; then
                  # annotated tag：object.sha 是 tag 对象，要再剥一层才是 commit
                  existing_commit=$(gh api "$REPO_API/git/tags/$existing_sha" --jq '.object.sha' 2>/dev/null || echo "")
              else
                  existing_commit="$existing_sha"
              fi
          else
              echo ">>> 远端没有 tag $TAG"
          fi
          echo ">>> 现有 tag $TAG 指向: ${existing_commit:-<不存在>}"

          if [ -z "$existing_commit" ]; then
              echo ">>> 创建 annotated tag $TAG -> ${GITHUB_SHA:0:12}"
              # ⚠ message 的换行用 printf 构造，不能直接写 \n：
              #   gh api 的 -f 不做转义，message="a\nb" 传过去的是**字面** \n 两个字符
              #   而不是真换行（实测过）。也不能用 $'...' —— ANSI-C 引用**不做变量展开**，
              #   ${BOARD} 会原样留在 message 里（也实测过）。printf 两个问题都没有。
              TAG_MSG=$(printf '%s\ncommit: %s\nu-boot 来源: %s\n由 CI 自动创建（tag 指向本次构建的 commit）。' \
                  "$BOARD $TAG" "$GITHUB_SHA" "$UBOOT_KIND")
              TAG_OBJ=$(gh api --method POST "$REPO_API/git/tags" \
                  -f tag="$TAG" \
                  -f message="$TAG_MSG" \
                  -f object="$GITHUB_SHA" \
                  -f type=commit \
                  -f "tagger[name]=${{ github.actor }}" \
                  -f "tagger[email]=${{ github.actor }}@users.noreply.github.com" \
                  --jq '.sha')
              gh api --method POST "$REPO_API/git/refs" \
                  -f ref="$TAG_REF" -f sha="$TAG_OBJ" >/dev/null
          elif [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo ">>> ⚠ tag $TAG 原指向 ${existing_commit:0:12}，与本次构建 ${GITHUB_SHA:0:12} 不符 → 强制移动"
              # 删 ref 再重建（annotated 与 lightweight 统一处理）
              gh api --method DELETE "$REPO_API/git/refs/tags/$TAG" >/dev/null
              TAG_MSG=$(printf '%s\ncommit: %s\nu-boot 来源: %s\n（重建：原 tag 指向 %.12s，与本次构建不符）' \
                  "$BOARD $TAG" "$GITHUB_SHA" "$UBOOT_KIND" "$existing_commit")
              TAG_OBJ=$(gh api --method POST "$REPO_API/git/tags" \
                  -f tag="$TAG" \
                  -f message="$TAG_MSG" \
                  -f object="$GITHUB_SHA" \
                  -f type=commit \
                  -f "tagger[name]=${{ github.actor }}" \
                  -f "tagger[email]=${{ github.actor }}@users.noreply.github.com" \
                  --jq '.sha')
              gh api --method POST "$REPO_API/git/refs" \
                  -f ref="$TAG_REF" -f sha="$TAG_OBJ" >/dev/null
          else
              echo ">>> tag $TAG 已指向 ${GITHUB_SHA:0:12}，不动"
          fi


          # 生成 release 说明
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## halo-a311d \`${TAG}\`"
            echo
            echo "> **u-boot 来源：${UBOOT_KIND}**"
            echo
            echo "| 项 | 值 |"
            echo "|----|----|"
            echo "| BOARD | \`${{ env.BOARD }}\` |"
            echo "| BOARDFAMILY | \`${{ env.FAMILY }}\` |"
            echo "| BRANCH | \`${{ env.BRANCH }}\` |"
            echo "| RELEASE | \`noble\` (Ubuntu 24.04) |"
            echo "| 镜像类型 | \`minimal\` |"
            echo "| commit | ${GITHUB_SHA:0:12} |"
            echo
            echo "### 产物"
            ls -la "$STAGE" | tail -n +2 | awk '{printf "- `%s` (%d B)\n", $NF, $5}'
            echo
            echo "### 刷写"
            echo '```bash'
            echo "# ⚠ 先确认设备名，别刷错盘："
            echo "lsblk"
            echo "dmesg | grep -i mmc"
            echo
            echo "# 刷到 SD 卡座（底板 CARD1，&sd_emmc_b）"
            echo "dd if=Armbian_*.img of=/dev/sdX bs=4M conv=fsync status=progress"
            echo
            echo "# 刷到 eMMC（核心板，&sd_emmc_c）"
            echo "dd if=Armbian_*.img of=/dev/mmcblkX bs=4M conv=fsync status=progress"
            echo '```'
            echo
            echo "> 板上有 SD 卡座（CARD1，信号经 CN2 + ESD U35/U36/U37），"
            echo "> 也有核心板 eMMC，两者都由本板 dts 启用（\`&sd_emmc_b\` / \`&sd_emmc_c\`）。"
            echo "> 设备节点编号按实际 mmc 探测顺序而定，务必先 \`lsblk\` 确认。"
            echo
            echo "> ⚠ **尚未在真机上验证过启动。** DTS 与内核均在 CI 编译通过，"
            echo "> 但 PCIe/USB3.0 冷切换与各外设功能需实机确认。"
          } > "$NOTES"

          # 同名 Release 已存在 → 先删掉旧的
          # ⚠⚠ 原来这里用的是 `--cleanup-tag`，会**连带删掉 git tag**。
          #   在「只有推 tag 才能发」的前提下这是可接受的（tag 本就是本次触发源）。
          #   但现在 dispatch 也能发，且允许用户手填 tag 名 ——
          #   同名 Release 重跑就会把用户好好立着的 tag 删掉，属于误伤。
          #   → 一律不删 tag。重跑同一 tag 时 tag 本就指向同一个 commit，无需动它。
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo ">>> Release $TAG 已存在，先删除旧的（保留 git tag）"
              gh release delete "$TAG" --yes
          fi

          echo
          echo "=== 创建 Release $TAG ==="
          # ⚠ 不能用 --verify-tag：
          #   gh 按**当前 git remote** 找 tag，而 CI 检出的是 armbian/build
          #   → 报 "tag xxx doesn't exist in the repo armbian/build"
          #   tag 本就是触发本次 run 的前提，存在性无需再验。
          #   --repo 显式指定目标仓库，避免 gh 猜错 remote。
          gh release create "$TAG" \
            --title "halo-a311d $TAG" \
            --notes-file "$NOTES" \
            --repo "${{ github.repository }}" \
            "$STAGE"/*

          echo
          echo "=== 发布完成 ==="
          # ⚠ 必须带 --repo：gh 会按当前 git remote 猜，而 CI 检出的是 armbian/build
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q '.url'
